[project]
name = "traceable-rag"
version = "0.5.0"
description = "Verifiable document retrieval and Source context for AI agents."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
  "agentic-rag",
  "citations",
  "document-retrieval",
  "evidence",
  "rag",
]
classifiers = [
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "cryptography>=44.0",
  "fastapi>=0.115",
  "pillow>=11.0",
  "uvicorn[standard]>=0.30",
  "pypdf==6.18.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/yo-solo/traceable-rag"
Documentation = "https://github.com/yo-solo/traceable-rag/tree/main/docs"
Repository = "https://github.com/yo-solo/traceable-rag.git"
Issues = "https://github.com/yo-solo/traceable-rag/issues"
Changelog = "https://github.com/yo-solo/traceable-rag/blob/main/CHANGELOG.md"
Security = "https://github.com/yo-solo/traceable-rag/security/policy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["traceable_rag"]

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evaluation dependencies
        run: python -m pip install -e '.[dev]' -e ./evaluation
      - name: Run ViDoRe evaluation tests
        run: python -m pytest -q tests/test_vidore_evaluation.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test -- --run --maxWorkers=1
      - name: Run TypeScript and production build
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend runtime for the browser server
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Install and build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Run Playwright and accessibility suite when present
        shell: bash
        working-directory: web
        run: |
          if node -e "process.exit(require('./package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            npx playwright install --with-deps chromium
            npm run test:e2e
          else
            echo "No test:e2e script yet; browser smoke runs in the Docker job."
          fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Check OpenAPI, Skill, and release contracts
        run: >-
          python -m pytest -q
          tests/test_openapi.py
          tests/test_codex_skill_template.py
          tests/test_release_contract.py

  windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse Windows deployment scripts with the PowerShell AST
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @("install.ps1", "deploy/traceable-rag.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run the packaged installer through an iex-equivalent path
        shell: powershell
        run: |
          $versionMatch = Select-String -LiteralPath pyproject.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $versionMatch) { throw "project version not found" }
          $version = "v$($versionMatch.Matches[0].Groups[1].Value)"
          $root = Join-Path $env:RUNNER_TEMP "可验证部署-路径"
          $release = Join-Path $root "release"
          $stage = Join-Path $root "stage"
          New-Item -ItemType Directory -Force -Path $release, (Join-Path $stage "deploy") | Out-Null
          Copy-Item deploy/compose.yaml, deploy/traceable-rag, deploy/traceable-rag.ps1 -Destination (Join-Path $stage "deploy")
          $manifest = [ordered]@{
            schema_version = 1
            version = $version
            image = "ghcr.io/yo-solo/traceable-rag-public"
            index_digest = "sha256:" + ("b" * 64)
            platforms = [ordered]@{
              "linux/amd64" = "sha256:" + ("c" * 64)
              "linux/arm64" = "sha256:" + ("d" * 64)
            }
            source_commit = "e" * 40
          } | ConvertTo-Json -Depth 4
          $manifestPath = Join-Path $release "release-manifest.json"
          [IO.File]::WriteAllText($manifestPath, "$manifest`n", (New-Object Text.UTF8Encoding($false)))
          Copy-Item $manifestPath -Destination (Join-Path $stage "deploy/release-manifest.json")
          $archive = Join-Path $release "traceable-rag-deployment-$version.zip"
          Compress-Archive -Path (Join-Path $stage "deploy") -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $release "SHA256SUMS"), "$hash  traceable-rag-deployment-$version.zip`n$manifestHash  release-manifest.json`n", (New-Object Text.UTF8Encoding($false)))
          $rendered = ([IO.File]::ReadAllText((Resolve-Path "install.ps1"))).Replace("@TRACEABLE_RAG_VERSION@", $version)
          $renderedPath = Join-Path $root "rendered-install.ps1"
          [IO.File]::WriteAllText($renderedPath, $rendered, (New-Object Text.UTF8Encoding($false)))
          $port = Get-Random -Minimum 20000 -Maximum 40000
          $server = Start-Process python -ArgumentList @("-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", $release) -PassThru
          try {
            Start-Sleep -Seconds 2
            $env:TRACEABLE_RAG_HOME = Join-Path $root "installed"
            $env:TRACEABLE_RAG_NO_START = "1"
            $env:TRACEABLE_RAG_RELEASE_BASE_URL = "http://127.0.0.1:$port"
            Invoke-Expression ([IO.File]::ReadAllText($renderedPath))
            $key = Join-Path $env:TRACEABLE_RAG_HOME "config/secrets/master.key"
            $before = (Get-FileHash $key -Algorithm SHA256).Hash
            Invoke-Expression ([IO.File]::ReadAllText($renderedPath))
            if ((Get-FileHash $key -Algorithm SHA256).Hash -ne $before) { throw "packaged iex rerun replaced the master key" }
            $previousPolicy = Get-ExecutionPolicy -Scope CurrentUser
            try {
              Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Restricted -Force
              & (Join-Path $env:TRACEABLE_RAG_HOME "bin/traceable-rag.cmd") help | Out-Null
              if ($LASTEXITCODE) { throw "managed cmd launcher failed under CurrentUser Restricted policy" }
            } finally {
              Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy $previousPolicy -Force
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Dry-run the idempotent Windows installer without Docker
        shell: powershell
        run: |
          $env:TRACEABLE_RAG_HOME = Join-Path $env:RUNNER_TEMP "traceable-rag-deployment-test"
          $env:TRACEABLE_RAG_NO_START = "1"
          & ./install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $key = Join-Path $env:TRACEABLE_RAG_HOME "config/secrets/master.key"
          $token = Join-Path $env:TRACEABLE_RAG_HOME "config/secrets/admin-token"
          $envFile = Join-Path $env:TRACEABLE_RAG_HOME "config/deployment.env"
          if ((Get-Item $key).Length -ne 32) { throw "master key length mismatch" }
          if ((Get-Item $token).Length -ne 64) { throw "admin token length mismatch" }
          $keyHash = (Get-FileHash $key -Algorithm SHA256).Hash
          $tokenHash = (Get-FileHash $token -Algorithm SHA256).Hash
          & ./install.ps1
          if ((Get-FileHash $key -Algorithm SHA256).Hash -ne $keyHash) { throw "idempotent install replaced the master key" }
          if ((Get-FileHash $token -Algorithm SHA256).Hash -ne $tokenHash) { throw "idempotent install replaced the admin token" }
          $prefix = [IO.File]::ReadAllBytes($envFile) | Select-Object -First 3
          if ($prefix.Count -eq 3 -and $prefix[0] -eq 0xEF -and $prefix[1] -eq 0xBB -and $prefix[2] -eq 0xBF) { throw "deployment.env contains a UTF-8 BOM" }
          & (Join-Path $env:TRACEABLE_RAG_HOME "config/traceable-rag.ps1") help | Out-Null
          $env:TRACEABLE_RAG_VERSION = "v9.9.9"
          try {
            & ./install.ps1
            throw "cross-version installer rerun unexpectedly succeeded"
          } catch {
            if ($_.Exception.Message -notmatch "traceable-rag upgrade v9.9.9") { throw }
          } finally {
            Remove-Item Env:TRACEABLE_RAG_VERSION
          }
      - name: Refuse to claim an existing unmarked Windows directory
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "traceable-rag-unmarked-test"
          $config = Join-Path $root "config"
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          Set-Content -LiteralPath (Join-Path $config "unrelated.txt") -Value "keep"
          $env:TRACEABLE_RAG_CONFIG_DIR = $config
          $env:TRACEABLE_RAG_DATA_DIR = Join-Path $root "data"
          $env:TRACEABLE_RAG_STATE_DIR = Join-Path $root "state"
          $env:TRACEABLE_RAG_BACKUP_DIR = Join-Path $root "backups"
          $env:TRACEABLE_RAG_BIN_DIR = Join-Path $root "bin"
          $env:TRACEABLE_RAG_NO_START = "1"
          try {
            & ./install.ps1
            throw "installer unexpectedly claimed a non-empty unmarked directory"
          } catch {
            if ($_.Exception.Message -notmatch "refusing to claim") { throw }
          }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the public snapshot boundary
        run: python scripts/check_public_snapshot.py
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Audit Python dependencies
        run: |
          python -m pip install -e '.[dev]' pip-audit
          pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm run audit

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - contracts
      - security
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: traceable-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: traceable-rag:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
      - name: Run health and route smoke tests
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/traceable-rag-ci"
          mkdir -p "$runtime/data/home" "$runtime/data/managed" "$runtime/secrets"
          dd if=/dev/urandom of="$runtime/secrets/master.key" bs=32 count=1 status=none
          openssl rand -hex 32 > "$runtime/secrets/admin-token"
          chmod 0600 "$runtime/secrets/master.key" "$runtime/secrets/admin-token"
          docker run --detach \
            --name traceable-rag-ci \
            --user "$(id -u):$(id -g)" \
            --publish 127.0.0.1:18000:8000 \
            --env TRACEABLE_RAG_PROVIDER_STORE_PATH=/data/providers.db \
            --env TRACEABLE_RAG_MASTER_KEY_FILE=/run/secrets/traceable-rag-master-key \
            --env TRACEABLE_RAG_ADMIN_TOKEN_FILE=/run/secrets/traceable-rag-admin-token \
            --volume "$runtime/data:/data" \
            --volume "$runtime/secrets/master.key:/run/secrets/traceable-rag-master-key:ro" \
            --volume "$runtime/secrets/admin-token:/run/secrets/traceable-rag-admin-token:ro" \
            traceable-rag:ci
          cleanup() {
            docker rm --force traceable-rag-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:18000/readyz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs traceable-rag-ci
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/livez >/dev/null
          curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null
          curl --fail --silent --header 'Accept: text/html' http://127.0.0.1:18000/ >/dev/null
          curl --fail --silent --header 'Accept: text/html' http://127.0.0.1:18000/retrieval >/dev/null
          curl --fail --silent http://127.0.0.1:18000/favicon.svg >/dev/null
